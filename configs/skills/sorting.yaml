# Skill vocabulary for parcel sorting (design doc §4). Skills only reference prompt ids;
# the texts live in the executor's prompt library.
version: 1
library: mock_sort_v1
predicates:                                   # computed from proprio on every tick
  holding: "0.01 < gripper_width < 0.08"
  empty_grasp: "gripper_closed and gripper_width <= 0.01"
  released: "gripper_width > 0.08"
skills:
  pick:
    prompt: pick_next
    preconditions: ["not holding"]
    verify:
      success: [{when: holding, hold_s: 0.5}]
      failure: [{when: empty_grasp, hold_s: 0.3}]            # the reason defaults to the predicate name
    on_failure:
      # design doc §13. Retries count towards max_consecutive_failures (3): one retry, the second miss goes
      # to the planner, and a third miss in a row holds. (retry: 2 would hold before the planner is asked.)
      empty_grasp: {retry: 1, before_retry: [retract]}
      timeout: {escalate: planner}
  flip:
    prompt: flip
    preconditions: ["holding"]
    min_duration_s: 4                                        # no visual check in v1: 4 s and still holding
    verify:
      success: [{when: holding}]
      failure: [{reason: dropped, when: "not holding", hold_s: 0.3}]
    on_failure:
      dropped: {escalate: planner, rollback: pick}         # the package fell: a plan redoes its pick
  place:
    args:
      bin: {type: enum, values: [A, B, C]}
    prompt: {A: place_bin_a, B: place_bin_b, C: place_bin_c}
    preconditions: ["holding"]
    verify:
      success: [{when: released, hold_s: 0.3}]
    on_failure:
      timeout: {retry: 1}
    effects:
      on_success: ["ledger.sorted[args.bin] += 1"]
  retract:
    executor: scripted                                       # a harness primitive, not a policy prompt
    timeout_s: 5
defaults:
  on_failure: {escalate: planner}
  max_consecutive_failures: 3
