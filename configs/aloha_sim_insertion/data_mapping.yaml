# lerobot/aloha_sim_insertion_* -> planner inputs (for `data planner`). ALOHA state is 14 values:
# left arm joints 0-5, left gripper 6, right arm joints 7-12, right gripper 13 (joints in radians).
state_key: observation.state
cameras:
  top: observation.images.top
proprio:
  left_waist: "state[0]"
  left_shoulder: "state[1]"
  left_elbow: "state[2]"
  left_forearm_roll: "state[3]"
  left_wrist_angle: "state[4]"
  left_wrist_rotate: "state[5]"
  left_gripper: "state[6]"
  right_waist: "state[7]"
  right_shoulder: "state[8]"
  right_elbow: "state[9]"
  right_forearm_roll: "state[10]"
  right_wrist_angle: "state[11]"
  right_wrist_rotate: "state[12]"
  right_gripper: "state[13]"
