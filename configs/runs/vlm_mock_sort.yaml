# M1: the fine-tuned Qwen3-VL-2B planner, served by vLLM, driving the mock world with three
# synthetic cameras. This exercises the whole image -> vLLM -> decision path without a robot;
# a model trained on real images will not plan well from the synthetic pictures.
# Start vLLM first (see README). Planner calls block the simulated clock here (threaded: false);
# on the robot use threaded: true with the real clock.
name: vlm_mock_sort
task: ../tasks/sort_by_size.yaml
skills: ../skills/sorting.yaml
env:
  type: mock_sorting
  params:
    num_packages: 10
    barcode_down_prob: 0.3
    cameras: [head, wrist_left, wrist_right]
    image_size: [448, 336]
executor:
  type: mock
  library: ../libraries/mock_sort_v1.yaml
  handoff: finish_chunk
  params: {chunk_size: 5}
planner:
  type: openai_compat
  threaded: false
  timeout_s: 30
  params:
    base_url: http://127.0.0.1:8000/v1
    model: vlm-planner                       # --served-model-name given to vllm serve
    cameras: [head, wrist_left, wrist_right]  # order and resolution must match the training data
    image_size: [448, 336]
    proprio_keys: [gripper_width, gripper_closed]
    temperature: 0.0
    resample_temperature: 0.7
    structured_output: response_format
    # api_key_env: PLANNER_API_KEY       # if vllm serve was started with --api-key
runtime:
  clock: sim
  control_hz: 10
  primitive_steps: {retract: 5}
trace:
  root: runs
