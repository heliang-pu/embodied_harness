[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-harness"
version = "0.1.0"
description = "Embodied Harness: a runtime that runs a VLM planner and robot policy as one closed loop."
readme = "README.md"
requires-python = ">=3.10"
# numpy is a core dependency: the runner and the env adapters import it, so the CLI needs it to start.
# The extras' other packages (msgpack, websockets, Pillow, pyarrow) are imported only where they are used.
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The VLM planner encodes camera images before sending them to vLLM.
planner = [
    "numpy>=1.24",
    "pillow>=10",
]
# Exporting lerobot-annotate datasets. Decoding video frames also needs the `lerobot` package.
data = [
    "embodied-harness[planner]",
    "pyarrow>=14",
]
# Websocket policy client and server (openpi protocol).
policy = [
    "msgpack>=1.0",
    "numpy>=1.24",
    "websockets>=13",
]
dev = [
    "embodied-harness[data,policy]",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
embodied-harness = "embodied_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Chinese full-width punctuation in sample strings and comments is intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
